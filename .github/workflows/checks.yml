name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.3.0", "2026.9.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt "homeassistant==${{ matrix.homeassistant }}"
      - name: Lint
        run: python -m ruff check custom_components tests
      - name: Check formatting
        run: python -m ruff format --check custom_components tests
      - name: Run tests
        run: python -m unittest discover -s tests/codex_usage -v
